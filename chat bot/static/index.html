<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NexaBank — Live Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --navy:#0B1F3A;--navy-mid:#142849;--navy-light:#1E3A5F;
      --gold:#C9A84C;--gold-light:#E8C96A;
      --cream:#F7F4EE;--white:#FFFFFF;
      --muted:#8A9BB0;--border:#D4C9A8;
      --green:#4ADE80;--red:#F87171;
    }
    body{font-family:'Inter',sans-serif;background:var(--navy);min-height:100vh;display:flex;flex-direction:column}

    /* TOP NAV */
    nav{background:var(--navy);border-bottom:2px solid var(--gold);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
    .nav-logo{font-family:'DM Serif Display',serif;color:var(--white);font-size:20px}
    .nav-logo span{color:var(--gold)}
    .nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
    .live-badge{background:rgba(74,222,128,0.15);border:1px solid var(--green);color:var(--green);
      font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:20px;letter-spacing:0.5px}
    .live-badge::before{content:"● ";font-size:8px}
    .time-label{color:var(--muted);font-size:11px;font-family:monospace}

    /* TICKER */
    .ticker-wrap{background:var(--navy-mid);border-bottom:1px solid rgba(201,168,76,0.2);
      padding:7px 0;overflow:hidden;flex-shrink:0}
    .ticker-inner{display:flex;gap:28px;animation:scroll 28s linear infinite;white-space:nowrap;width:max-content}
    .ticker-wrap:hover .ticker-inner{animation-play-state:paused}
    @keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
    .ticker-item{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
    .ticker-item .sym{color:var(--gold-light);font-weight:600}
    .ticker-item .up{color:var(--green)}
    .ticker-item .dn{color:var(--red)}

    /* MAIN LAYOUT */
    .layout{display:flex;flex:1;overflow:hidden;gap:0}

    /* LEFT PANEL */
    .panel{width:300px;flex-shrink:0;background:var(--navy-mid);border-right:1px solid rgba(201,168,76,0.15);
      display:flex;flex-direction:column;overflow-y:auto;padding:16px;gap:14px}
    .panel::-webkit-scrollbar{width:4px}
    .panel::-webkit-scrollbar-thumb{background:var(--navy-light);border-radius:4px}

    .card{background:var(--navy);border:1px solid rgba(201,168,76,0.2);border-radius:12px;padding:14px}
    .card-title{font-size:10px;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);margin-bottom:10px;font-weight:600}
    .balance-main{font-family:'DM Serif Display',serif;font-size:26px;color:var(--white)}
    .balance-main span{font-size:14px;color:var(--gold)}
    .balance-sub{font-size:12px;color:var(--muted);margin-top:4px}
    .balance-sub b{color:var(--gold-light)}

    /* TRANSACTIONS */
    .txn-list{display:flex;flex-direction:column;gap:8px}
    .txn-row{display:flex;justify-content:space-between;align-items:center}
    .txn-desc{font-size:12px;color:var(--cream)}
    .txn-date{font-size:10px;color:var(--muted);margin-top:1px}
    .txn-amt{font-size:12px;font-weight:600}
    .txn-amt.cr{color:var(--green)}
    .txn-amt.dr{color:var(--red)}

    /* STOCKS */
    .stock-list{display:flex;flex-direction:column;gap:8px}
    .stock-row{display:flex;justify-content:space-between;align-items:center}
    .stock-sym{font-size:12px;color:var(--gold-light);font-weight:600}
    .stock-price{font-size:12px;color:var(--white);font-weight:500}
    .stock-chg{font-size:11px;padding:1px 6px;border-radius:8px}
    .stock-chg.up{background:rgba(74,222,128,0.15);color:var(--green)}
    .stock-chg.dn{background:rgba(248,113,113,0.15);color:var(--red)}

    /* FOREX */
    .forex-list{display:flex;flex-direction:column;gap:7px}
    .forex-row{display:flex;justify-content:space-between}
    .forex-pair{font-size:11.5px;color:var(--muted)}
    .forex-rate{font-size:11.5px;color:var(--cream);font-weight:500}

    /* CHAT AREA */
    .chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden}

    .messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:#0D2240;
      scrollbar-width:thin;scrollbar-color:var(--navy-light) transparent}
    .messages::-webkit-scrollbar{width:4px}
    .messages::-webkit-scrollbar-thumb{background:var(--navy-light);border-radius:4px}

    .divider{text-align:center;font-size:10.5px;color:var(--muted);letter-spacing:0.6px;text-transform:uppercase}

    .msg-row{display:flex;align-items:flex-end;gap:8px}
    .msg-row.user{flex-direction:row-reverse}
    .msg-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;
      justify-content:center;font-size:13px;flex-shrink:0}
    .msg-row.bot .msg-icon{background:var(--navy)}
    .msg-row.user .msg-icon{background:var(--gold)}
    .bubble{max-width:75%;padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.6;white-space:pre-line}
    .msg-row.bot .bubble{background:var(--navy-mid);color:var(--cream);border-bottom-left-radius:4px}
    .msg-row.user .bubble{background:var(--gold);color:var(--navy);border-bottom-right-radius:4px;font-weight:500}
    .bubble .time{display:block;font-size:10px;margin-top:4px;opacity:0.5;text-align:right}

    .typing .bubble{display:flex;gap:5px;align-items:center;padding:14px 16px}
    .dot{width:6px;height:6px;background:var(--muted);border-radius:50%;animation:bounce 1.2s infinite}
    .dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
    @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

    /* CHIPS */
    .chips-wrap{background:var(--navy-mid);border-top:1px solid rgba(201,168,76,0.15);
      padding:8px 14px;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
    .chips-wrap::-webkit-scrollbar{display:none}
    .chip{background:transparent;border:1px solid rgba(201,168,76,0.35);color:var(--gold-light);
      font-size:11.5px;font-weight:500;padding:5px 12px;border-radius:20px;cursor:pointer;
      white-space:nowrap;transition:all .2s;font-family:'Inter',sans-serif}
    .chip:hover{background:var(--gold);color:var(--navy);border-color:var(--gold)}

    /* INPUT */
    .input-bar{background:var(--navy);border-top:1px solid rgba(201,168,76,0.15);
      padding:12px 14px;display:flex;gap:10px;align-items:center;flex-shrink:0}
    #msgInput{flex:1;border:1.5px solid rgba(201,168,76,0.3);border-radius:24px;padding:10px 16px;
      font-size:13.5px;font-family:'Inter',sans-serif;color:var(--cream);
      background:var(--navy-mid);outline:none;transition:border-color .2s}
    #msgInput:focus{border-color:var(--gold)}
    #msgInput::placeholder{color:var(--muted)}
    #msgInput:disabled{opacity:.4;cursor:not-allowed}
    #sendBtn{width:40px;height:40px;border-radius:50%;border:none;background:var(--gold);
      color:var(--navy);cursor:pointer;display:flex;align-items:center;justify-content:center;
      font-size:16px;flex-shrink:0;transition:all .2s;font-weight:700}
    #sendBtn:hover{background:var(--gold-light)}
    #sendBtn:active{transform:scale(.92)}
    #sendBtn:disabled{opacity:.4;cursor:not-allowed}

    .flash{animation:flash .6s ease}
    @keyframes flash{0%,100%{opacity:1}50%{opacity:0.3}}
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-logo">Nexa<span>Bank</span></div>
  <div class="nav-right">
    <span class="live-badge">LIVE</span>
    <span class="time-label" id="liveTime">--:--:--</span>
  </div>
</nav>

<!-- TICKER -->
<div class="ticker-wrap">
  <div class="ticker-inner" id="ticker"></div>
</div>

<!-- MAIN -->
<div class="layout">

  <!-- LEFT PANEL -->
  <div class="panel">

    <!-- BALANCE -->
    <div class="card">
      <div class="card-title">Account Overview</div>
      <div class="balance-main"><span>₹</span><span id="balAmt">25,000.00</span></div>
      <div class="balance-sub">Savings: <b id="savAmt">₹12,500.00</b></div>
    </div>

    <!-- TRANSACTIONS -->
    <div class="card">
      <div class="card-title">Recent Transactions</div>
      <div class="txn-list" id="txnList"></div>
    </div>

    <!-- STOCKS -->
    <div class="card">
      <div class="card-title">📈 Live Stocks</div>
      <div class="stock-list" id="stockList"></div>
    </div>

    <!-- FOREX -->
    <div class="card">
      <div class="card-title">💱 Exchange Rates</div>
      <div class="forex-list" id="forexList"></div>
    </div>

  </div>

  <!-- CHAT -->
  <div class="chat-area">
    <div class="messages" id="messages">
      <div class="divider">Today</div>
      <div class="msg-row bot">
        <div class="msg-icon">🏦</div>
        <div class="bubble">
          Welcome to <strong>NexaBank</strong>! I have live access to your account, stocks, and forex rates. Ask me anything!
          <span class="time" id="wt"></span>
        </div>
      </div>
    </div>

    <div class="chips-wrap">
      <button class="chip" onclick="sendChip('What is my balance?')">💰 Balance</button>
      <button class="chip" onclick="sendChip('Show recent transactions')">📋 Transactions</button>
      <button class="chip" onclick="sendChip('Show live stock prices')">📈 Stocks</button>
      <button class="chip" onclick="sendChip('Show exchange rates')">💱 Forex</button>
      <button class="chip" onclick="sendChip('Apply for a loan')">🏠 Loan</button>
      <button class="chip" onclick="sendChip('I need help')">🙋 Help</button>
    </div>

    <div class="input-bar">
      <input type="text" id="msgInput" placeholder="Ask about balance, stocks, forex…" autocomplete="off" disabled/>
      <button id="sendBtn" onclick="sendMessage()" disabled>➤</button>
    </div>
  </div>

</div>

<script>
  document.getElementById('wt').textContent = getTime();

  function getTime(){ return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }

  const socket     = io();
  const messagesEl = document.getElementById('messages');
  const input      = document.getElementById('msgInput');
  const sendBtn    = document.getElementById('sendBtn');

  // ── INIT DATA ──
  socket.on('init_data', d => {
    renderBalance(d.account);
    renderTransactions(d.account.transactions);
    renderStocks(d.stocks);
    renderForex(d.forex);
    renderTicker(d.stocks, d.forex);
    document.getElementById('liveTime').textContent = d.time;
    input.disabled = false; sendBtn.disabled = false; input.focus();
  });

  // ── LIVE UPDATES ──
  socket.on('live_update', d => {
    renderStocks(d.stocks);
    renderForex(d.forex);
    renderTicker(d.stocks, d.forex);
    document.getElementById('liveTime').textContent = d.time;
  });

  // ── BOT REPLY ──
  socket.on('bot_response', d => {
    removeTyping();
    appendMessage('bot', d.response);
    sendBtn.disabled = false; input.disabled = false; input.focus();
  });

  // ── SEND ──
  input.addEventListener('keydown', e => { if(e.key==='Enter') sendMessage(); });
  function sendChip(t){ input.value=t; sendMessage(); }
  function sendMessage(){
    const text = input.value.trim();
    if(!text || sendBtn.disabled) return;
    input.value='';
    appendMessage('user', text);
    sendBtn.disabled=true; input.disabled=true;
    showTyping();
    socket.emit('user_message',{message:text});
  }

  // ── RENDER HELPERS ──
  function renderBalance(a){
    document.getElementById('balAmt').textContent = Number(a.balance).toLocaleString('en-IN',{minimumFractionDigits:2});
    document.getElementById('savAmt').textContent = '₹'+Number(a.savings).toLocaleString('en-IN',{minimumFractionDigits:2});
  }

  function renderTransactions(txns){
    const el = document.getElementById('txnList');
    el.innerHTML = txns.slice(0,5).map(t => `
      <div class="txn-row">
        <div><div class="txn-desc">${t.desc}</div><div class="txn-date">${t.date}</div></div>
        <div class="txn-amt ${t.amount>0?'cr':'dr'}">${t.amount>0?'+':''}₹${Math.abs(t.amount).toLocaleString('en-IN')}</div>
      </div>`).join('');
  }

  function renderStocks(stocks){
    const el = document.getElementById('stockList');
    el.innerHTML = Object.entries(stocks).map(([s,d]) => `
      <div class="stock-row">
        <span class="stock-sym">${s}</span>
        <span class="stock-price">₹${d.price.toLocaleString('en-IN',{minimumFractionDigits:2})}</span>
        <span class="stock-chg ${d.change>=0?'up':'dn'}">${d.change>=0?'+':''}${d.change}%</span>
      </div>`).join('');
    el.classList.add('flash');
    setTimeout(()=>el.classList.remove('flash'),600);
  }

  function renderForex(forex){
    const el = document.getElementById('forexList');
    el.innerHTML = Object.entries(forex).map(([p,r]) => `
      <div class="forex-row">
        <span class="forex-pair">${p}</span>
        <span class="forex-rate">₹${r.toFixed(4)}</span>
      </div>`).join('');
  }

  function renderTicker(stocks, forex){
    const items = [
      ...Object.entries(stocks).map(([s,d])=>
        `<div class="ticker-item"><span class="sym">${s}</span><span>₹${d.price.toFixed(2)}</span><span class="${d.change>=0?'up':'dn'}">${d.change>=0?'▲':'▼'}${Math.abs(d.change)}%</span></div>`),
      ...Object.entries(forex).map(([p,r])=>
        `<div class="ticker-item"><span class="sym">${p}</span><span>₹${r.toFixed(4)}</span></div>`)
    ].join('');
    // duplicate for seamless loop
    document.getElementById('ticker').innerHTML = items + items;
  }

  function appendMessage(role, text){
    const row=document.createElement('div'); row.className=`msg-row ${role}`;
    const icon=document.createElement('div'); icon.className='msg-icon'; icon.textContent=role==='bot'?'🏦':'👤';
    const bubble=document.createElement('div'); bubble.className='bubble';
    bubble.innerHTML=`${text}<span class="time">${getTime()}</span>`;
    row.appendChild(icon); row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop=messagesEl.scrollHeight;
  }

  function showTyping(){
    const row=document.createElement('div'); row.className='msg-row bot typing'; row.id='typing';
    const icon=document.createElement('div'); icon.className='msg-icon'; icon.textContent='🏦';
    const bubble=document.createElement('div'); bubble.className='bubble';
    bubble.innerHTML='<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
    row.appendChild(icon); row.appendChild(bubble);
    messagesEl.appendChild(row); messagesEl.scrollTop=messagesEl.scrollHeight;
  }

  function removeTyping(){ const t=document.getElementById('typing'); if(t) t.remove(); }
</script>
</body>
</html>
